name: Backend verification
on:
  push:
    paths: ["backend/**", "tests/backend/**", "pytest.ini", "compose.backend.yaml", ".dockerignore", ".github/workflows/backend.yml", ".env.example", "docs/backend/**", "README.md"]
  pull_request:
    paths: ["backend/**", "tests/backend/**", "pytest.ini", "compose.backend.yaml", ".dockerignore", ".github/workflows/backend.yml", ".env.example", "docs/backend/**", "README.md"]
permissions:
  contents: read

jobs:
  api-security-and-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medilink_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: backend-ci-synthetic-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d medilink_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MEDILINK_TEST_DB_DSN: "dbname=medilink_test host=127.0.0.1 port=5432 user=postgres password=backend-ci-synthetic-only"
      MEDILINK_BENCHMARK_ADMIN_DSN: "dbname=medilink_test host=127.0.0.1 port=5432 user=postgres password=backend-ci-synthetic-only"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "backend/requirements-*.txt"
      - run: python -m pip install -r backend/requirements-test.txt
      - name: Check the published API contract
        run: python -m backend.ops.export_contract --check
      - name: Lint the backend-owned boundary
        run: >-
          ruff check --select F backend/api backend/core backend/db backend/graph
          backend/integrations backend/observability backend/ops backend/recovery
          backend/risk backend/services backend/application.py backend/auth/security.py tests/backend
      - name: Unit, API, security and database tests
        run: python -m pytest -q --junitxml=artifacts/backend-tests.xml
      - name: Require the database-backed checks to actually run
        run: |
          python - <<'PY'
          from xml.etree import ElementTree as E
          suites = E.parse('artifacts/backend-tests.xml').getroot().iter('testsuite')
          assert all(int(s.attrib.get('skipped', 0)) == 0 for s in suites), 'Database tests must not be skipped'
          PY
      - name: Synthetic backend handoff rehearsal
        run: python -m backend.ops.rehearse --output artifacts/backend-rehearsal.json
      - name: Simple read benchmark (provisional p95 target)
        run: python -m backend.ops.benchmark --target-p95-ms 500 --output artifacts/backend-benchmark.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: backend-tests-and-benchmark
          path: artifacts/

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install "httpx>=0.27,<1"
      - name: Build, startup, health, persistence and outage recovery
        run: python -m backend.ops.compose_smoke --output artifacts/backend-compose.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: backend-compose-smoke
          path: artifacts/

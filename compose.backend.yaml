x-backend-environment: &backend-environment
  MEDILINK_DB_HOST: db
  MEDILINK_DB_PORT: "5432"
  MEDILINK_DB_NAME: ${MEDILINK_DB_NAME:-medilink}
  MEDILINK_DB_USER: ${MEDILINK_DB_USER:-medilink}
  MEDILINK_DB_PASSWORD: ${MEDILINK_DB_PASSWORD:?Set MEDILINK_DB_PASSWORD}
  MEDILINK_JWT_SECRET: ${MEDILINK_JWT_SECRET:?Set MEDILINK_JWT_SECRET}
  MEDILINK_CARD_SECRET: ${MEDILINK_CARD_SECRET:?Set MEDILINK_CARD_SECRET}
  MEDILINK_ACTION_SIGNING_SECRET: ${MEDILINK_ACTION_SIGNING_SECRET:-}
  MEDILINK_DOCUMENT_STORAGE_DIR: /app/var/documents
  MEDILINK_DB_CONNECT_TIMEOUT: ${MEDILINK_DB_CONNECT_TIMEOUT:-5}
  MEDILINK_DB_STATEMENT_TIMEOUT_MS: ${MEDILINK_DB_STATEMENT_TIMEOUT_MS:-5000}
  MEDILINK_ACCESS_TOKEN_MINUTES: ${MEDILINK_ACCESS_TOKEN_MINUTES:-60}
  MEDILINK_CORS_ORIGINS: ${MEDILINK_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  MEDILINK_DOCUMENT_MAX_BYTES: ${MEDILINK_DOCUMENT_MAX_BYTES:-5242880}
  MEDILINK_DOCUMENT_MAX_IMAGE_PIXELS: ${MEDILINK_DOCUMENT_MAX_IMAGE_PIXELS:-20000000}
  MEDILINK_DOCUMENT_MAX_PDF_PAGES: ${MEDILINK_DOCUMENT_MAX_PDF_PAGES:-100}
  MEDILINK_MCP_CONFIG_FILE: ${MEDILINK_MCP_CONFIG_FILE:-}
  MEDILINK_GRAPH_SERVICE_URL: ${MEDILINK_GRAPH_SERVICE_URL:-}
  MEDILINK_GRAPH_SERVICE_TOKEN: ${MEDILINK_GRAPH_SERVICE_TOKEN:-}
  MEDILINK_GRAPH_TIMEOUT_SECONDS: ${MEDILINK_GRAPH_TIMEOUT_SECONDS:-10}
  MEDILINK_GRAPH_MAX_RESULTS: ${MEDILINK_GRAPH_MAX_RESULTS:-100}
  MEDILINK_MEDIUM_RISK_REVIEW: ${MEDILINK_MEDIUM_RISK_REVIEW:-required}
  MEDILINK_APPROVAL_TTL_MINUTES: ${MEDILINK_APPROVAL_TTL_MINUTES:-60}
  MEDILINK_RECOVERY_SERVICE_URL: ${MEDILINK_RECOVERY_SERVICE_URL:-}
  MEDILINK_RECOVERY_SERVICE_TOKEN: ${MEDILINK_RECOVERY_SERVICE_TOKEN:-}
  MEDILINK_RECOVERY_TIMEOUT_SECONDS: ${MEDILINK_RECOVERY_TIMEOUT_SECONDS:-10}
  MEDILINK_RECONCILIATION_STALE_SECONDS: ${MEDILINK_RECONCILIATION_STALE_SECONDS:-300}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${MEDILINK_DB_NAME:-medilink}
      POSTGRES_USER: ${MEDILINK_DB_USER:-medilink}
      POSTGRES_PASSWORD: ${MEDILINK_DB_PASSWORD:?Set MEDILINK_DB_PASSWORD}
    volumes:
      - backend-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: medilink-backend:part-10
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "backend.db.migrate"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: "no"

  backend:
    image: medilink-backend:part-10
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${MEDILINK_API_PORT:-8000}:8000"
    volumes:
      - backend-documents:/app/var/documents
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped

volumes:
  backend-postgres:
  backend-documents:
